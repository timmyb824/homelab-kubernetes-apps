---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: mortgage-rate-scraper
  namespace: scripts
spec:
  schedule: "0 9 * * *"
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: mortgage-rate-scraper
        spec:
          containers:
            - name: mortgage-rate-scraper
              image: timmyb824/python-mortgageratescraper:latest
              imagePullPolicy: Always
              envFrom:
                - secretRef:
                    name: scripts-secrets
          restartPolicy: OnFailure
