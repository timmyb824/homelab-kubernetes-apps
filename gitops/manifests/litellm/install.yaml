apiVersion: v1
kind: Namespace
metadata:
  name: litellm
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: litellm
data:
  config.yaml: |
    model_list:
      # OPENROUTER MODELS
      - model_name: glm-5.3-flash-or
        litellm_params:
          model: openrouter/z-ai/glm-5.3-flash
          api_key: os.environ/OPENROUTER_API_KEY

      - model_name: anthropic/claude-opus-5.5-or
        litellm_params:
          model: openrouter/anthropic/claude-opus-5.5
          api_key: os.environ/OPENROUTER_API_KEY

      - model_name: gpt-6-astra-or
        litellm_params:
          model: openrouter/openai/gpt-6-astra
          api_key: os.environ/OPENROUTER_API_KEY

      - model_name: openrouter/auto
        litellm_params:
          model: openrouter/auto
          api_key: os.environ/OPENROUTER_API_KEY

      - model_name: openrouter/auto-code
        litellm_params:
          model: openrouter/auto-code
          api_key: os.environ/OPENROUTER_API_KEY

      - model_name: gemini-flash-latest-or
        litellm_params:
          model: openrouter/~google/gemini-flash-latest
          api_key: os.environ/OPENROUTER_API_KEY

      - model_name: glm-latest-or
        litellm_params:
          model: openrouter/~z-ai/glm-latest
          api_key: os.environ/OPENROUTER_API_KEY

      - model_name: gpt-terra-latest-or
        litellm_params:
          model: openrouter/~openai/gpt-terra-latest
          api_key: os.environ/OPENROUTER_API_KEY

      - model_name: gpt-luna-latest-or
        litellm_params:
          model: openrouter/~openai/gpt-luna-latest
          api_key: os.environ/OPENROUTER_API_KEY

      - model_name: gpt-mini-latest-or
        litellm_params:
          model: openrouter/~openai/gpt-mini-latest
          api_key: os.environ/OPENROUTER_API_KEY

      - model_name: gpt-chat-latest-or
        litellm_params:
          model: openrouter/openai/gpt-chat-latest
          api_key: os.environ/OPENROUTER_API_KEY

      - model_name: kimi-latest-or
        litellm_params:
          model: openrouter/~moonshotai/kimi-latest
          api_key: os.environ/OPENROUTER_API_KEY

      - model_name: claude-haiku-latest-or
        litellm_params:
          model: openrouter/~anthropic/claude-haiku-latest
          api_key: os.environ/OPENROUTER_API_KEY

      - model_name: claude-sonnet-latest-or
        litellm_params:
          model: openrouter/~anthropic/claude-sonnet-latest
          api_key: os.environ/OPENROUTER_API_KEY

      - model_name: gemma-4-31b-it:free-or
        litellm_params:
          model: openrouter/google/gemma-4-31b-it:free
          api_key: os.environ/OPENROUTER_API_KEY

      - model_name: flint-v1.0:free-or
        litellm_params:
          model: openrouter/recursive/flint-v1.0:free
          api_key: os.environ/OPENROUTER_API_KEY

      - model_name: north-mini-code:free-or
        litellm_params:
          model: openrouter/cohere/north-mini-code:free
          api_key: os.environ/OPENROUTER_API_KEY

      - model_name: gemini-3.1-flash-image-or
        litellm_params:
          model: openrouter/google/gemini-3.1-flash-image
          api_key: os.environ/OPENROUTER_API_KEY

      - model_name: deepseek-v4.1-flash-or
        litellm_params:
          model: openrouter/deepseek/deepseek-v4.1-flash
          api_key: os.environ/OPENROUTER_API_KEY

      - model_name: text-embedding-3-small-or
        litellm_params:
          model: openrouter/openai/text-embedding-3-small
          api_key: os.environ/OPENROUTER_API_KEY
        model_info:
          mode: embedding

      # ANTHROPIC MODELS
      - model_name: claude-haiku-5-5
        litellm_params:
          model: anthropic/claude-haiku-5-5
          api_key: os.environ/ANTHROPIC_API_KEY

      - model_name: claude-sonnet-5-5
        litellm_params:
          model: anthropic/claude-sonnet-5-5
          api_key: os.environ/ANTHROPIC_API_KEY

      - model_name: claude-opus-5-5
        litellm_params:
          model: anthropic/claude-opus-5-5
          api_key: os.environ/ANTHROPIC_API_KEY

      # OPENAI MODELS
      - model_name: gpt-6-astra
        litellm_params:
          model: openai/gpt-6-astra
          api_key: os.environ/OPENAI_API_KEY

      - model_name: gpt-5.6-terra
        litellm_params:
          model: openai/gpt-5.6-terra
          api_key: os.environ/OPENAI_API_KEY

      - model_name: gpt-5.6-luna
        litellm_params:
          model: openai/gpt-5.6-luna
          api_key: os.environ/OPENAI_API_KEY

      - model_name: chat-latest
        litellm_params:
          model: openai/chat-latest
          api_key: os.environ/OPENAI_API_KEY

      - model_name: gpt-6.1-sol
        litellm_params:
          model: openai/gpt-6.1-sol
          api_key: os.environ/OPENAI_API_KEY

    litellm_settings:
      success_callback: ["prometheus", "otel"]
      require_auth_for_metrics_endpoint: false
      telemetry: false
      drop_params: true
      cache: true
      enable_redis_auth_cache: true
      cache_params:
        type: redis
        host: os.environ/REDIS_HOST
        password: os.environ/REDIS_PASSWORD
        port: 6379

    general_settings:
      # disable_prisma_schema_update: true
      master_key: os.environ/LITELLM_MASTER_KEY
      disable_env_credential_login: true
      num_retries: 0
      request_timeout: 600
      store_model_in_db: true
      store_prompts_in_spend_logs: true
---
apiVersion: v1
kind: Secret
metadata:
  name: litellm-secrets
  namespace: litellm
type: Opaque
stringData:
  OPENAI_API_KEY: "<path:secret/data/argocd#OPENAI_PROJECT_KEY>"
  ANTHROPIC_API_KEY: "<path:secret/data/argocd#ANTHROPIC_API_KEY>"
  POE_API_KEY: "<path:secret/data/argocd#POE_API_KEY>"
  LITELLM_MASTER_KEY: "<path:secret/data/argocd#LITELLM_MASTER_KEY>"
  OPENROUTER_API_KEY: "<path:secret/data/argocd#OPENROUTER_LITELLM_KEY>"
  DATABASE_URL: "<path:secret/data/database#PG_CONN_STRING>/litellm_utf8?schema=public"
  REDIS_HOST: "<path:secret/data/database#REDIS_HOST>"
  REDIS_PASSWORD: "<path:secret/data/database#REDIS_PASSWORD>"
  SMTP_HOST: "<path:secret/data/google_smtp#SMTP_HOST>"
  SMTP_PORT: "587"
  SMTP_USERNAME: "<path:secret/data/google_smtp#SMTP_USER>"
  SMTP_PASSWORD: "<path:secret/data/google_smtp#SMTP_PASSWORD>"
  SMTP_SENDER_EMAIL: "<path:secret/data/google_smtp#SMTP_FROM>"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: litellm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: litellm
  template:
    metadata:
      labels:
        app: litellm
        app.kubernetes.io/name: litellm
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "4000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: litellm
          image: ghcr.io/berriai/litellm:v1.108.3
          imagePullPolicy: Always
          args:
            - "--config"
            - "/app/config.yaml"
          ports:
            - containerPort: 4000
          env:
            - name: OTEL_EXPORTER
              value: otlp_http
            - name: OTEL_ENDPOINT
              value: http://opentelemetry-collector.monitoring.svc.cluster.local:4318
            - name: OTEL_SERVICE_NAME
              value: litellm
          envFrom:
            - secretRef:
                name: litellm-secrets
          volumeMounts:
            - name: config
              mountPath: /app/config.yaml
              subPath: config.yaml
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: 4000
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /health/liveliness
              port: 4000
            initialDelaySeconds: 90
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              memory: 512Mi
              cpu: 100m
            limits:
              memory: 1500Mi
              cpu: 500m
      volumes:
        - name: config
          configMap:
            name: litellm-config
---
apiVersion: v1
kind: Service
metadata:
  name: litellm
  namespace: litellm
spec:
  selector:
    app: litellm
  ports:
    - port: 4000
      targetPort: 4000
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: litellm-public
  namespace: litellm
  annotations:
    kubernetes.io/ingress.class: traefik-external
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`litellm.timmybtech.com`)
      kind: Rule
      services:
        - name: litellm
          port: 4000
  tls:
    secretName: timmybtech-com-tls
