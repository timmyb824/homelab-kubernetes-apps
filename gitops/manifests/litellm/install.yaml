      - model_name: kimi-k2-or
        litellm_params:
          model: openrouter/moonshot-ai/kimi-k2
          api_key: os.environ/OPENROUTER_API_KEY

      - model_name: gemini-3.5-flash-or
        litellm_params:
          model: openrouter/google/gemini-3.5-flash
          api_key: os.environ/OPENROUTER_API_KEY
