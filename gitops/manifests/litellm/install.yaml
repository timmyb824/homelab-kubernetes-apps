      - model_name: qwen2.5-coder
        litellm_params:
          model: ollama/qwen2.5-coder:7b
          api_base: http://ollama.homelab.lan:11434

      - model_name: llama3.1
        litellm_params:
          model: ollama/llama3.1:8b
          api_base: http://ollama.homelab.lan:11434

      - model_name: qwen2.5-coder-14b
        litellm_params:
          model: ollama/qwen2.5-coder:14b
          api_base: http://ollama.homelab.lan:11434

      - model_name: qwen2.5-coder-7b-base
        litellm_params:
          model: ollama/qwen2.5-coder:7b-base
          api_base: http://ollama.homelab.lan:11434

    litellm_settings:
      success_callback: ["prometheus", "otel"]
      require_auth_for_metrics_endpoint: false
      otel_exporter_otlp_endpoint: http://opentelemetry-collector.monitoring.svc.cluster.local:4318
      telemetry: false
      drop_params: true
      cache: true
      enable_redis_auth_cache: true
      cache_params:
        type: redis
        host: os.environ/REDIS_HOST
        password: os.environ/REDIS_PASSWORD
        port: 6379

    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
      num_retries: 0
      request_timeout: 600
      store_model_in_db: true
      store_prompts_in_spend_logs: true
---
apiVersion: v1
kind: Secret
metadata:
  name: litellm-secrets
  namespace: litellm
type: Opaque
stringData:
  OPENAI_API_KEY: "<path:secret/data/argocd#OPENAI_PROJECT_KEY>"
  ANTHROPIC_API_KEY: "<path:secret/data/argocd#ANTHROPIC_API_KEY>"
  POE_API_KEY: "<path:secret/data/argocd#POE_API_KEY>"
  LITELLM_MASTER_KEY: "<path:secret/data/argocd#LITELLM_MASTER_KEY>"
  OPENROUTER_API_KEY: "<path:secret/data/argocd#OPENROUTER_LITELLM_KEY>"
  DATABASE_URL: "<path:secret/data/database#PG_CONN_STRING>/litellm?schema=public"
  REDIS_HOST: "<path:secret/data/database#REDIS_HOST>"
  REDIS_PASSWORD: "<path:secret/data/database#REDIS_PASSWORD>"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: litellm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: litellm
  template:
    metadata:
      labels:
        app: litellm
        app.kubernetes.io/name: litellm
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "4000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: litellm
          image: ghcr.io/berriai/litellm:v1.100.1
          imagePullPolicy: Always
          args:
            - "--config"
            - "/app/config.yaml"
          ports:
            - containerPort: 4000
          envFrom:
            - secretRef:
                name: litellm-secrets
          volumeMounts:
            - name: config
              mountPath: /app/config.yaml
              subPath: config.yaml
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: 4000
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /health/liveliness
              port: 4000
            initialDelaySeconds: 90
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              memory: 512Mi
              cpu: 100m
            limits:
              memory: 1500Mi
              cpu: 500m
      volumes:
        - name: config
          configMap:
            name: litellm-config
---
apiVersion: v1
kind: Service
metadata:
  name: litellm
  namespace: litellm
spec:
  selector:
    app: litellm
  ports:
    - port: 4000
      targetPort: 4000
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: litellm-public
  namespace: litellm
  annotations:
    kubernetes.io/ingress.class: traefik-external
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`litellm.timmybtech.com`)
      kind: Rule
      services:
        - name: litellm
          port: 4000
  tls:
    secretName: timmybtech-com-tls
