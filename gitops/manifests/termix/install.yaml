apiVersion: v1
kind: Namespace
metadata:
  name: termix
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: termix-data
  namespace: termix
spec:
  storageClassName: nfs-csi-synologynas
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 8Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: termix
  namespace: termix
  labels:
    app: termix
spec:
  replicas: 1
  selector:
    matchLabels:
      app: termix
  template:
    metadata:
      labels:
        app: termix
        app.kubernetes.io/name: termix
    spec:
      containers:
        - name: termix
          image: ghcr.io/termix-ssh/termix:26.10.1
          imagePullPolicy: Always
          env:
            - name: PUID
              value: "0"
            - name: PGID
              value: "0"
            - name: PORT
              value: "8080"
            - name: GUACD_HOST
              value: "127.0.0.1"
            - name: GUACD_TUNNEL_HOST
              value: "127.0.0.1"
            - name: GUACD_RECORDING_PATH
              value: "/termix-data/session_recordings/guacamole"
            - name: GUACD_DRIVE_PATH
              value: "/termix-data/rdp-drive"
            - name: DATABASE_DIALECT
              value: "postgres"
            - name: DATABASE_URL
              value: "<path:secret/data/database#PG_CONN_STRING>/termix"
            - name: REDIS_URL
              value: "<path:secret/data/database#REDIS_CONN_STRING>/6"
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: data
              mountPath: /app/data
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
          resources:
            requests:
              memory: "64Mi"
              cpu: "256m"
            limits:
              memory: "128Mi"
              cpu: "512m"
        - name: guacd
          image: guacamole/guacd:1.6.0
          resources:
            requests:
              memory: "64Mi"
              cpu: "256m"
            limits:
              memory: "128Mi"
              cpu: "512m"
          volumeMounts:
            - name: data
              mountPath: /termix-data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: termix-data
---
apiVersion: v1
kind: Service
metadata:
  name: termix
  namespace: termix
  labels:
    app: termix
spec:
  selector:
    app: termix
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  type: ClusterIP
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: termix-internal
  namespace: termix
  annotations:
    kubernetes.io/ingress.class: traefik-external
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`termix.local.timmybtech.com`)
      kind: Rule
      services:
        - name: termix
          port: 8080
  tls:
    secretName: local-timmybtech-com-tls
