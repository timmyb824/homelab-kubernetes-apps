---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: coder-ingress
  namespace: coder
  annotations:
    kubernetes.io/ingress.class: traefik-external
    external-dns.kubernetes.io/enabled: "true"
    external-dns.kubernetes.io/target: traefik.local.timmybtech.com
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`coder.local.timmybtech.com`)
      kind: Rule
      services:
        - name: coder
          port: 80
    - match: Host(`coder.local.timmybtech.com`) && PathPrefix(`/metrics`)
      kind: Rule
      services:
        - name: coder
          port: 2112
  tls:
    secretName: local-timmybtech-com-tls
