---
apiVersion: v1
kind: Namespace
metadata:
  name: bambuddy
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bambuddy-data-pvc
  namespace: bambuddy
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: nfs-csi-synologynas
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bambuddy-logs-pvc
  namespace: bambuddy
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: nfs-csi-synologynas
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: manyfold-libraries-ro-pv
spec:
  capacity:
    storage: 24Gi
  accessModes:
    - ReadOnlyMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    - ro
  nfs:
    server: 192.168.86.44
    path: /volume1/kubernetes/manyfold-manyfold-libraries-pvc-pvc-1e282cbf-e05d-4595-94b4-0ce15713c9f4
    readOnly: true
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: manyfold-libraries-pvc
  namespace: bambuddy
spec:
  accessModes: ["ReadOnlyMany"]
  storageClassName: ""
  volumeName: manyfold-libraries-ro-pv
  resources:
    requests:
      storage: 24Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bambuddy
  namespace: bambuddy
  labels:
    app: bambuddy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bambuddy
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: bambuddy
        app.kubernetes.io/name: bambuddy
    spec:
      enableServiceLinks: false
      securityContext:
        fsGroup: 1000
      containers:
        - name: bambuddy
          image: ghcr.io/maziggy/bambuddy:1.2.5.6
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
            - name: ftp-control
              containerPort: 990
              protocol: TCP
            - name: rtsp
              containerPort: 322
              protocol: TCP
            - name: mqtt
              containerPort: 8883
              protocol: TCP
          securityContext:
            capabilities:
              add:
                - NET_BIND_SERVICE
          env:
            - name: TZ
              value: America/New_York
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: PORT
              value: "8000"
            - name: BAMBUDDY_EXTERNAL_ROOTS
              value: "/mnt/manyfold-libraries"
          resources:
            limits:
              cpu: 1000m
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: logs
              mountPath: /app/logs
            - name: manyfold-libraries
              mountPath: /mnt/manyfold-libraries
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: bambuddy-data-pvc
        - name: logs
          persistentVolumeClaim:
            claimName: bambuddy-logs-pvc
        - name: manyfold-libraries
          persistentVolumeClaim:
            claimName: manyfold-libraries-pvc
            readOnly: true
---
apiVersion: v1
kind: Service
metadata:
  name: bambuddy
  namespace: bambuddy
  labels:
    app: bambuddy
spec:
  selector:
    app: bambuddy
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 8000
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: bambuddy-internal
  namespace: bambuddy
  annotations:
    kubernetes.io/ingress.class: traefik-external
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`bambuddy.local.timmybtech.com`)
      kind: Rule
      services:
        - name: bambuddy
          port: 80
  tls:
    secretName: local-timmybtech-com-tls
