apiVersion: v1
kind: Namespace
metadata:
  name: cloudflared
---
apiVersion: v1
kind: Secret
metadata:
  name: tunnel-credentials
  namespace: cloudflared
type: Opaque
stringData:
  credentials.json: >-
    <path:secret/data/cloudflared#HOMELAB_CREDENTIALS>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: cloudflared
spec:
  selector:
    matchLabels:
      app: cloudflared
  replicas: 2
  template:
    metadata:
      labels:
        app: cloudflared
        app.kubernetes.io/name: cloudflared
    spec:
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.9.1
          args:
            - tunnel
            - --config
            - /etc/cloudflared/config/config.yaml
            - --loglevel
            - debug
            - run
          livenessProbe:
            httpGet:
              path: /ready
              port: 2000
            failureThreshold: 1
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /etc/cloudflared/config
              readOnly: true
            - name: creds
              mountPath: /etc/cloudflared/creds
              readOnly: true
      volumes:
        - name: creds
          secret:
            secretName: tunnel-credentials
        - name: config
          configMap:
            name: cloudflared
            items:
              - key: config.yaml
                path: config.yaml
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared
  namespace: cloudflared
data:
  config.yaml: |
    tunnel: homelab
    credentials-file: /etc/cloudflared/creds/credentials.json
    metrics: 0.0.0.0:2000
    no-autoupdate: true
    ingress:
    - hostname: authentik.timmybtech.com
      service: https://traefik.traefik.svc.cluster.local:443
      originRequest:
        noTLSVerify: true
        headers:
          X-Forwarded-Proto: https
    - hostname: authentik-outpost.timmybtech.com
      service: https://traefik.traefik.svc.cluster.local:443
      originRequest:
        noTLSVerify: true
        headers:
          X-Forwarded-Proto: https
    - hostname: grafana2.timmybtech.com
      service: https://traefik.traefik.svc.cluster.local:443
      originRequest:
        noTLSVerify: true
        trustForwardHeader: true
        headers:
          X-Forwarded-Proto: https
          X-Forwarded-Host: grafana2.timmybtech.com
    - hostname: status.timmybtech.com
      service: https://traefik.traefik.svc.cluster.local:443
      originRequest:
        noTLSVerify: true
        headers:
          X-Forwarded-Proto: https
    - hostname: healthchecks.timmybtech.com
      service: https://traefik.traefik.svc.cluster.local:443
      originRequest:
        noTLSVerify: true
        headers:
          X-Forwarded-Proto: https
    - hostname: hoarder.timmybtech.com
      service: https://traefik.traefik.svc.cluster.local:443
      originRequest:
        noTLSVerify: true
        headers:
          X-Forwarded-Proto: https
    - hostname: immich.timmybtech.com
      service: https://traefik.traefik.svc.cluster.local:443
      originRequest:
        noTLSVerify: true
        headers:
          X-Forwarded-Proto: https
    - hostname: n8n.timmybtech.com
      service: https://traefik.traefik.svc.cluster.local:443
      originRequest:
        noTLSVerify: true
        trustForwardHeader: true
        headers:
          X-Forwarded-Proto: https
          X-Forwarded-Host: n8n.timmybtech.com
          X-Forwarded-For: n8n.timmybtech.com
    - hostname: searxng.timmybtech.com
      service: https://traefik.traefik.svc.cluster.local:443
      originRequest:
        noTLSVerify: true
        headers:
          X-Forwarded-Proto: https
    - hostname: umami.timmybtech.com
      service: https://traefik.traefik.svc.cluster.local:443
      originRequest:
        noTLSVerify: true
        headers:
          X-Forwarded-Proto: https
    - hostname: litellm.timmybtech.com
      service: https://traefik.traefik.svc.cluster.local:443
      originRequest:
        noTLSVerify: true
        headers:
          X-Forwarded-Proto: https
    - hostname: rustfs-endpoint.timmybtech.com
      service: https://traefik.traefik.svc.cluster.local:443
      originRequest:
        noTLSVerify: true
        headers:
          X-Forwarded-Proto: https
    - hostname: bytestash.timmybtech.com
      service: https://traefik.traefik.svc.cluster.local:443
      originRequest:
        noTLSVerify: true
        headers:
          X-Forwarded-Proto: https
    - hostname: name-picker.timmybtech.com
      service: https://traefik.traefik.svc.cluster.local:443
      originRequest:
