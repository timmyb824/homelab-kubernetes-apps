#           service:
#             name: portainer
#             port:
#               number: 9443
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: portainer-ingress
  namespace: portainer
  annotations:
    kubernetes.io/ingress.class: traefik-external
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`portainer.local.timmybtech.com`) # create A record in pihole
      kind: Rule
      services:
        - name: portainer
          port: 9443
  tls:
    secretName: local-timmybtech-com-tls # or local-example-com-staging-tls
